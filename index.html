<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ASF Inspiração — Frase do dia do surf feminino | ASF</title><meta name="description" content="Frase do dia e histórias inspiradoras do surf feminino para começar a manhã com energia. Satélite do app ASF."><link rel="canonical" href="https://acarolmourad-commits.github.io/asf-inspiracao/"><meta name="theme-color" content="#00A8CC"><style>:root{--p:#00A8CC;--d:#0E2439;--u:#9B59B6;--bg:#F7FBFC;--g:#5A6B7A}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--d);min-height:100vh;display:flex;flex-direction:column}nav{position:sticky;top:0;background:#fff;border-bottom:1px solid #E5EEF2;padding:10px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}nav a{color:var(--p);text-decoration:none;font-weight:700;font-size:13px}nav a.on{color:var(--u)}.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 20px;background:linear-gradient(160deg,#0E2439,#00A8CC 70%,#9B59B6);color:#fff}blockquote{font-size:clamp(20px,4.5vw,30px);font-weight:700;max-width:640px;line-height:1.4}.autor{margin-top:14px;opacity:.85;font-size:14px}.nova{margin-top:26px;background:#fff;color:var(--p);border:0;padding:12px 26px;border-radius:999px;font-weight:800;font-size:14px;cursor:pointer}footer{text-align:center;font-size:12.5px;color:var(--g);padding:20px;border-top:1px solid #E5EEF2}</style></head><body><nav><a href="https://acarolmourad-commits.github.io/asf-app/">🏄 App</a><a class="on" href="https://acarolmourad-commits.github.io/asf-inspiracao/">✨ Inspiração</a><a href="https://acarolmourad-commits.github.io/asf-historia/">📜 História</a><a href="https://acarolmourad-commits.github.io/asf-mental/">🧠 Mental</a><a href="https://acarolmourad-commits.github.io/asf-filmes/">🎬 Filmes</a></nav><main class="hero"><blockquote id="frase"></blockquote><div class="autor" id="autor"></div><button class="nova" onclick="nova()">Outra frase 🔄</button></main><footer>🌊 ASF · <a href="https://acarolmourad-commits.github.io/" style="color:var(--p)">Hub de apps</a> · Frases também no <a href="https://acarolmourad-commits.github.io/asf-app/" style="color:var(--p)">App ASF</a></footer><script>const frases=[['A melhor surfista no mar é a que está se divertindo mais.','Filosofia do line-up'],['Elas disseram que o mar era dos outros. A gente discordou.','ASF'],['Medo é só o corpo lembrando que você está viva. Respira e vai.','Ritual pré-sessão'],['Nenhuma mulher chega no tubo sozinha: tem uma aldeia remando junto.','Comunidade ASF'],['A onda não espera. Também não espere para começar.','Para quem adia o primeiro drop'],['Caía sete vezes, levante oito — e ainda ria no caminho.','Toda surfista que evoluiu']];function nova(){const f=frases[Math.floor(Math.random()*frases.length)];document.getElementById('frase').textContent='“'+f[0]+'”';document.getElementById('autor').textContent='— '+f[1];}nova();</script></body></html>
